global:
  namespace: scopex
  imagePullPolicy: IfNotPresent
  logLevel: INFO
postgres:
  enabled: true
  image: postgres:16-alpine
  replicas: 1
  port: 5432
  database: scopex
  user: postgres
  password: postgres
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
redis:
  enabled: true
  image: redis:7-alpine
  replicas: 1
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
rabbitmq:
  enabled: true
  image: rabbitmq:3-management-alpine
  replicas: 1
  ports:
    amqp: 5672
    management: 15672
  user: guest
  password: guest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
product:
  image: scopex-product:latest
  replicas: 2
  port: 8001
  cache_enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
cart:
  image: scopex-cart:latest
  replicas: 2
  port: 8002
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
inventory:
  image: scopex-inventory:latest
  replicas: 2
  port: 8003
  db_pool_size: 50
  db_max_overflow: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
payment:
  image: scopex-payment:latest
  replicas: 2
  port: 8004
  latency_ms: 50
  failure_rate: 0.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
order:
  image: scopex-order:latest
  replicas: 2
  port: 8005
  consumer_count: 2
  db_pool_size: 50
  db_max_overflow: 5
  processing_delay_ms: 50
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
checkout:
  image: scopex-checkout:latest
  replicas: 2
  port: 8006
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
prometheus:
  enabled: true
  image: prom/prometheus:v2.51.0
  replicas: 1
  port: 9090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
grafana:
  enabled: true
  image: grafana/grafana:10.4.0
  replicas: 1
  port: 3000
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
