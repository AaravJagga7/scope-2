apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: scopex
  labels:
    app: checkout
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8006"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: checkout
          image: scopex-checkout:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.checkout.main:app", "--host", "0.0.0.0", "--port", "8006"]
          ports:
            - containerPort: 8006
              name: http
          env:
            - name: PORT
              value: "8006"
            - name: CART_SERVICE_URL
              value: "http://cart:8002"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8003"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment:8004"
            - name: ORDER_SERVICE_URL
              value: "http://order:8005"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: scopex
  labels:
    app: checkout
spec:
  type: ClusterIP
  ports:
    - port: 8006
      targetPort: 8006
      name: http
  selector:
    app: checkout
